name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    # Gate the release on the full workspace suite on the platform we ship
    # for. The Windows runner lacks the Japanese OCR pack by default, so it
    # is installed first — the integration tests exercise real Windows OCR
    # and real pdfium, same as a user's machine.
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify tag matches the workspace versions
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tauri = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $npm = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if (($tag -ne $cargo) -or ($tag -ne $tauri) -or ($tag -ne $npm)) {
            throw "version mismatch: tag=$tag Cargo.toml=$cargo tauri.conf.json=$tauri package.json=$npm"
          }
          "release version: $tag"

      - name: Install Japanese OCR language capability
        shell: pwsh
        run: |
          $cap = Get-WindowsCapability -Online -Name "Language.OCR~~~ja-JP*" |
            Select-Object -First 1
          if ($cap.State -ne "Installed") {
            Add-WindowsCapability -Online -Name $cap.Name | Out-Null
          }
          Get-WindowsCapability -Online -Name "Language.OCR~~~ja-JP*" |
            Format-Table Name, State

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable pinned 2026-04
      - uses: Swatinem/rust-cache@v2

      - name: Fetch pdfium
        shell: pwsh
        run: .\scripts\fetch-pdfium.ps1

      - name: Test
        shell: pwsh
        env:
          MENREIKI_PDFIUM_PATH: ${{ github.workspace }}\vendor\pdfium
        run: cargo test --workspace --locked

  build:
    name: Build (x64 Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable pinned 2026-04
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Fetch pdfium
        shell: pwsh
        run: .\scripts\fetch-pdfium.ps1

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop app (NSIS installer)
        shell: pwsh
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Build CLI
        shell: pwsh
        run: cargo build --release --locked -p menreiki-cli

      - name: Stage artifacts
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe |
            Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          Copy-Item $setup.FullName "menreiki-$version-x64-setup.exe"

          New-Item -ItemType Directory portable | Out-Null
          Copy-Item target/release/menreiki-desktop.exe portable/
          Copy-Item target/release/menreiki.exe portable/
          Copy-Item vendor/pdfium/pdfium.dll portable/
          Copy-Item docs/THIRD-PARTY-NOTICES.md, LICENSE-MIT, LICENSE-APACHE portable/
          Compress-Archive -Path portable/* -DestinationPath "menreiki-$version-x64-portable.zip"
          Get-ChildItem menreiki-*

      - name: Build MSIX (Microsoft Store)
        # Skipped until the Partner Center identity variables exist — see
        # packaging/msstore/README.jp.md. The package is unsigned; the Store
        # signs it on publication.
        if: vars.MSSTORE_IDENTITY_NAME != ''
        shell: pwsh
        env:
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY: ${{ vars.MSSTORE_PUBLISHER_DISPLAY }}
        run: |
          .\scripts\build-msix.ps1 -SkipBuild
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          Copy-Item out/msix/*.msix "menreiki-$version-x64.msix"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: menreiki-windows-x64
          path: menreiki-*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for actions/attest-build-provenance to mint a Sigstore
      # signing certificate via the GitHub OIDC provider.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Attest build provenance
        # Signed SLSA provenance for every artifact, so winget users (and
        # anyone else) can verify a binary was built by this workflow on
        # this commit. Runs before the release is created so a failure
        # aborts the release instead of publishing unattested binaries.
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: artifacts/*

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            artifacts/*

  winget:
    # Opens the update PR against microsoft/winget-pkgs. Skipped until the
    # WINGET_TOKEN secret (classic PAT, public_repo scope) exists and the
    # package has been submitted once by hand — see packaging/winget/.
    name: Publish to winget
    needs: release
    runs-on: windows-latest
    steps:
      - name: Check for winget token
        id: token
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if ($env:WINGET_TOKEN) { "present=true" >> $env:GITHUB_OUTPUT }
          else {
            "present=false" >> $env:GITHUB_OUTPUT
            Write-Host "WINGET_TOKEN not set - skipping winget submission"
          }

      - uses: vedantmgoyal9/winget-releaser@v2
        if: steps.token.outputs.present == 'true'
        with:
          identifier: ShortArrow.Menreiki
          installers-regex: '-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
