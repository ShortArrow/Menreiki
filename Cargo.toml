[workspace]
resolver = "2"
members = [
    "crates/menreiki-audit",
    "crates/menreiki-core",
    "crates/menreiki-project",
    "crates/menreiki-detect",
    "crates/menreiki-detect-universal",
    "crates/menreiki-entity",
    "crates/menreiki-inference",
    "crates/menreiki-lang-ja",
    "crates/menreiki-ocr",
    "crates/menreiki-policy",
    "crates/menreiki-render",
    "crates/menreiki-test-support",
    "adapters/pdfium",
    "adapters/windows-ocr",
    "apps/cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
menreiki-audit = { path = "crates/menreiki-audit" }
menreiki-core = { path = "crates/menreiki-core" }
menreiki-project = { path = "crates/menreiki-project" }
menreiki-detect = { path = "crates/menreiki-detect" }
menreiki-detect-universal = { path = "crates/menreiki-detect-universal" }
menreiki-entity = { path = "crates/menreiki-entity" }
menreiki-inference = { path = "crates/menreiki-inference" }
menreiki-lang-ja = { path = "crates/menreiki-lang-ja" }
menreiki-ocr = { path = "crates/menreiki-ocr" }
menreiki-policy = { path = "crates/menreiki-policy" }
regex = "1"
serde_yaml = "0.9"
flate2 = "1"
toml = "0.8"
winreg = "0.52"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
imageproc = "0.25"
ab_glyph = "0.2"
menreiki-render = { path = "crates/menreiki-render" }
menreiki-test-support = { path = "crates/menreiki-test-support" }
menreiki-adapter-pdfium = { path = "adapters/pdfium" }
menreiki-adapter-windows-ocr = { path = "adapters/windows-ocr" }
pdfium-render = "0.8"
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
